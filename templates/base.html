<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hệ thống Quản lý bảo trì{% endblock %}</title>
    <!-- Nhúng thư viện Bootstrap để có giao diện chuẩn -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { height: 100vh; background-color: #2c3e50; color: white; padding-top: 20px; }
        .sidebar a { color: #ecf0f1; text-decoration: none; display: block; padding: 12px 20px; font-weight: 500;}
        .sidebar a:hover { background-color: #34495e; color: #3498db; }
        .content { padding: 30px; background-color: #f8f9fa; height: 100vh; overflow-y: auto;}
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Menu dùng chung cho mọi trang -->
            <nav class="col-md-2 sidebar">
                <h4 class="text-center mb-4 border-bottom pb-2">QL BẢO TRÌ</h4>
                <a href="/">🏠 Trang chủ</a>
                <a href="#">💻 Quản lý thiết bị</a>
                <a href="#">📋 Phiếu bảo trì</a>
                <a href="#">⚙️ Quản lý nhân viên</a>
                <a href="#">📊 Báo cáo thống kê</a>
            </nav>

            <!-- Vùng nội dung sẽ thay đổi tùy theo người code -->
            <main class="col-md-10 content">
                {% block content %}
                <!-- Nội dung của các file html con sẽ được chèn vào đây -->
                {% endblock %}
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
